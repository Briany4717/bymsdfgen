[workspace]
resolver = "2"
members = [
    "crates/bymsdfgen-core",
    "crates/bymsdfgen-io",
    "crates/bymsdfgen-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Briany4717"]
description = "A complete pure-Rust implementation of Chlumský's msdfgen for ultra-fast multi-channel signed distance field generation."
keywords = ["msdf", "sdf", "font", "rendering", "msdfgen"]
categories = ["rendering::graphics-api", "game-engines"]
repository = "https://github.com/Briany4717/bymsdfgen"
homepage = "https://github.com/Briany4717/bymsdfgen"
readme = "README.md"
rust-version = "1.85"

[workspace.dependencies]
bymsdfgen-core = { path = "crates/bymsdfgen-core", version = "0.1.0" }
bymsdfgen-io = { path = "crates/bymsdfgen-io", version = "0.1.0" }
rayon = "1.10"
arrayvec = "0.7"
ttf-parser = "0.25"
png = "0.17"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
